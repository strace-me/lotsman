<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#0F3D47"/>

  <g fill="none" stroke="#F2EDE4" stroke-linecap="round" stroke-linejoin="round">
    <!-- limb arc -->
    <path d="M 126 355.2 A 260 260 0 0 0 386 355.2" stroke-width="22"/>
    <g stroke-width="6">
      <line x1="167.1" y1="374.4" x2="173.9" y2="355.6"/>
      <line x1="210.9" y1="386.1" x2="214.3" y2="366.4"/>
      <line x1="256"   y1="390"   x2="256"   y2="370"/>
      <line x1="301.1" y1="386.1" x2="297.7" y2="366.4"/>
      <line x1="344.9" y1="374.4" x2="338.1" y2="355.6"/>
    </g>
  </g>

  <!-- BOTTOM ASSEMBLY: index/vernier housing with readout window + three feet -->
  <g>
    <rect x="220" y="396" width="72" height="24" rx="7" fill="#F2EDE4"/>
    <rect x="231" y="403" width="50" height="9"  rx="4" fill="#0F3D47"/>
    <g stroke="#F2EDE4" stroke-width="9" stroke-linecap="round">
      <line x1="234" y1="420" x2="230" y2="438"/>
      <line x1="256" y1="420" x2="256" y2="440"/>
      <line x1="278" y1="420" x2="282" y2="438"/>
    </g>
  </g>

  <!-- frame struts + alidada -->
  <g fill="none" stroke="#F2EDE4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="256" y1="130" x2="126" y2="355.2" stroke-width="13"/>
    <line x1="256" y1="130" x2="386" y2="355.2" stroke-width="13"/>
    <line x1="256" y1="130" x2="292" y2="387"   stroke-width="15"/>
  </g>

  <!-- telescope -->
  <line x1="268" y1="208" x2="418" y2="194" stroke="#F2EDE4" stroke-width="40" stroke-linecap="round"/>
  <line x1="268" y1="208" x2="418" y2="194" stroke="#0F3D47" stroke-width="24" stroke-linecap="round"/>
  <circle cx="418" cy="194" r="9" fill="#0F3D47"/>

  <!-- LEFT CLUSTER: shade-filter stand (the "not only a mirror") beside the horizon mirror -->
  <g>
    <line x1="204" y1="220" x2="158" y2="230" stroke="#F2EDE4" stroke-width="8" stroke-linecap="round"/>
    <line x1="152" y1="226" x2="152" y2="278" stroke="#F2EDE4" stroke-width="7" stroke-linecap="round"/>
    <circle cx="152" cy="238" r="13" fill="#F2EDE4"/><circle cx="152" cy="238" r="6" fill="#0F3D47"/>
    <circle cx="152" cy="268" r="11" fill="#F2EDE4"/><circle cx="152" cy="268" r="5" fill="#0F3D47"/>
  </g>

  <!-- 3 CIRCLES = mirrors + drum, with mounts so they read as mirrors -->
  <!-- big index mirror at the apex, on a small bracket -->
  <line x1="256" y1="130" x2="273" y2="108" stroke="#F2EDE4" stroke-width="9" stroke-linecap="round"/>
  <circle cx="256" cy="112" r="25" fill="#F2EDE4"/><circle cx="256" cy="112" r="11" fill="#0F3D47"/>
  <!-- horizon mirror on the left strut -->
  <circle cx="204" cy="220" r="18" fill="#F2EDE4"/><circle cx="204" cy="220" r="7" fill="#0F3D47"/>
  <!-- micrometer drum on the limb -->
  <circle cx="292" cy="387" r="20" fill="#F2EDE4"/><circle cx="292" cy="387" r="8" fill="#0F3D47"/>
</svg>
