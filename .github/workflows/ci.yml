name: CI

# Runs on the working branch too, not just main: every push here failed for weeks
# with a 0-second run and no jobs, which sent an email each time and told nobody
# anything. Whatever GitHub disliked, it refused to say through the API — so this
# file is deliberately written in the plainest form available: block mappings
# only, no inline flow maps, no trailing comments on keys, no expression in a
# place that needs quoting.
on:
  push:
    branches:
      - main
      - prerelease-fixes
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # `.` walks .claude/worktrees too — agent scratch copies that are not ours
      # to format and would fail this step forever for reasons nobody can act on.
      - name: gofmt
        run: |
          bad=$(gofmt -l cmd pkg client)
          test -z "$bad" || { echo "$bad"; echo "run: gofmt -w cmd pkg client"; exit 1; }
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # The client ships for Windows and Android too, and both have had silent
  # breakage: a test file that failed to COMPILE on Windows made the whole
  # client/core package untestable there, and Go's "linux" build tag quietly
  # matches android. Cross building is cheap and catches exactly that class.
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: android
            goarch: arm64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        if: matrix.goos != 'android'
        run: go vet ./...
      # Tray only. The GUI embeds frontend/dist, which is a build artefact and is
      # not in git, so a fresh checkout cannot compile it without node and a vite
      # build — and its Go half is a thin pass-through anyway. The tray is the one
      # with real platform code, and it is what this job is for.
      - name: tray build
        if: matrix.goos == 'windows'
        run: cd client/tray && go build ./...
