org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; no support-library shim.
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Only build the ABIs we actually ship. gomobile emits arm64-v8a, armeabi-v7a,
# x86 and x86_64; every ABI you keep multiplies the APK by roughly the size of
# the embedded sing-box+lotsman .so. Narrow this in app/build.gradle.kts, not
# here, if you want a per-variant split.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
